name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 首次运行：生成固定签名的 keystore 并提交回仓库
      # 这样以后每次编译签名一致，可以直接覆盖安装
      - name: Ensure signing keystore (stable signature)
        run: |
          cd android
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias chickpet \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass chickpet123 -keypass chickpet123 \
              -dname "CN=ChickPet, OU=Dev, O=ChickPet, L=Beijing, ST=Beijing, C=CN"
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/keystore.jks
            git commit -m "chore: lock signing keystore [skip ci]"
            git push
          else
            echo "keystore already exists, signature stays stable"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Show result
        run: ls -lh android/app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: chickpet-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
